<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradMehndi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0f0e0d" />
    </linearGradient>
    <linearGradient id="goldArtMehndi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD5" />
      <stop offset="50%" stop-color="#E5B972" />
      <stop offset="100%" stop-color="#C59341" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGradMehndi)" stroke="#332d28" stroke-width="1.5" />
  
  <!-- Intricate Henna Mandala Motif in Center -->
  <g transform="translate(200, 140)">
    <circle cx="0" cy="0" r="12" fill="url(#goldArtMehndi)" />
    <circle cx="0" cy="0" r="22" stroke="url(#goldArtMehndi)" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="38" stroke="url(#goldArtMehndi)" stroke-width="1" />
    <circle cx="0" cy="0" r="54" stroke="url(#goldArtMehndi)" stroke-width="1.5" stroke-dasharray="4 2" />

    <!-- 8 Petals / Floral Mandala -->
    {/* Repeating 8 radial motifs */}
    <path d="M 0 -22 C -8 -30, -6 -45, 0 -52 C 6 -45, 8 -30, 0 -22 Z" fill="url(#goldArtMehndi)" opacity="0.85" />
    <path d="M 0 22 C -8 30, -6 45, 0 52 C 6 45, 8 30, 0 22 Z" fill="url(#goldArtMehndi)" opacity="0.85" />
    <path d="M -22 0 C -30 -8, -45 -6, -52 0 C -45 6, -30 8, -22 0 Z" fill="url(#goldArtMehndi)" opacity="0.85" />
    <path d="M 22 0 C 30 -8, 45 -6, 52 0 C 45 6, 30 8, 22 0 Z" fill="url(#goldArtMehndi)" opacity="0.85" />
    
    <path d="M -15 -15 C -25 -20, -35 -30, -37 -37 C -30 -35, -20 -25, -15 -15 Z" fill="url(#goldArtMehndi)" opacity="0.75" />
    <path d="M 15 -15 C 25 -20, 35 -30, 37 -37 C 30 -35, 20 -25, 15 -15 Z" fill="url(#goldArtMehndi)" opacity="0.75" />
    <path d="M -15 15 C -25 20, -35 30, -37 37 C -30 35, -20 25, -15 15 Z" fill="url(#goldArtMehndi)" opacity="0.75" />
    <path d="M 15 15 C 25 20, 35 30, 37 37 C 30 35, 20 25, 15 15 Z" fill="url(#goldArtMehndi)" opacity="0.75" />

    <!-- Outer Dots Ring -->
    <circle cx="0" cy="-62" r="2.5" fill="url(#goldArtMehndi)" />
    <circle cx="0" cy="62" r="2.5" fill="url(#goldArtMehndi)" />
    <circle cx="-62" cy="0" r="2.5" fill="url(#goldArtMehndi)" />
    <circle cx="62" cy="0" r="2.5" fill="url(#goldArtMehndi)" />
  </g>

  <!-- Caption -->
  <text x="200" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#E5B972">
    INTRICATE MEHNDI ARTISTRY
  </text>
  <text x="200" y="278" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8C827A">
    Bridal, Arabic &amp; Festive Designs
  </text>
</svg>

