<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradFacial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0f0e0d" />
    </linearGradient>
    <linearGradient id="aquaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="40%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#E5B972" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGradFacial)" stroke="#332d28" stroke-width="1.5" />
  
  <!-- Concentric Hydration Waves -->
  <circle cx="200" cy="140" r="85" stroke="#7DD3FC" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.3" />
  <circle cx="200" cy="140" r="68" stroke="#E5B972" stroke-width="1.2" opacity="0.5" />
  <circle cx="200" cy="140" r="50" stroke="#7DD3FC" stroke-width="1" opacity="0.4" />

  <!-- Elegant Water Droplet with Glow -->
  <path d="M 200 85 C 200 85, 165 135, 165 155 C 165 174, 180 190, 200 190 C 220 190, 235 174, 235 155 C 235 135, 200 85, 200 85 Z" 
        fill="url(#aquaGold)" opacity="0.8" />
  
  <!-- Droplet reflection highlight -->
  <path d="M 185 145 C 180 155, 180 168, 186 175" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- Micro bubbles & sparkles -->
  <circle cx="150" cy="115" r="4" fill="#7DD3FC" opacity="0.6" />
  <circle cx="245" cy="120" r="5" fill="#E5B972" opacity="0.7" />
  <circle cx="255" cy="165" r="3" fill="#7DD3FC" opacity="0.5" />

  <!-- Caption -->
  <text x="200" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#E5B972">
    HYDRA FACIAL &amp; GLOW THERAPY
  </text>
  <text x="200" y="278" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8C827A">
    Deep Cleansing &amp; Moisture Infusion
  </text>
</svg>

